# 每次 push／PR：跑完整測試（權限、邀請制、問卷、訓練紀錄、排程、通行金鑰…）
# 測試通過後跑 Lighthouse 品質檢查（tests/lighthouse.mjs）與端到端流程測試（tests/e2e/，Playwright）
# push 到 main 而且測試與品質檢查都通過：套用資料庫遷移並部署正式站
# push 到 staging 分支：部署測試環境 cil-run-staging
# 需要在 GitHub → Settings → Secrets and variables → Actions 設定：
#   CLOUDFLARE_API_TOKEN（權限：Workers Scripts:Edit、D1:Edit）、CLOUDFLARE_ACCOUNT_ID
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 語法檢查
        run: for f in src/*.js public/*.js; do node --check "$f"; done
      - name: 完整測試（本機 D1＋wrangler dev）
        run: npm run test:ci

  quality:
    # 上線前品質檢查：Lighthouse 量登入頁、首頁、課表、我的、過去的團練；效能 80、無障礙 95、最佳做法 95 以下就擋下部署
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lighthouse
        run: npm run test:lh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .wrangler/lighthouse/

  e2e:
    # 端到端：用真的瀏覽器（iPhone 尺寸）走過團員與幹部的主要流程，並用 axe 檢查 13 個頁面的無障礙；
    #   再用 iPhone Safari（WebKit）淺色、深色各逐頁掃一次版面，截圖放在 test-results/sweep*
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: 端到端測試
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            test-results/
            .wrangler/e2e-report/

  deploy:
    needs: [test, quality, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 部署
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "還沒設定 CLOUDFLARE_API_TOKEN，略過自動部署"; exit 0
          fi
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            npx wrangler d1 migrations apply cil-run --remote
            npx wrangler deploy
          else
            npx wrangler d1 migrations apply cil-run-staging --remote --env staging
            npx wrangler deploy --env staging
          fi
